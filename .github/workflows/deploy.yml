name: Build and Export Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Prepare Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Import Resources
        run: |
          godot --headless --verbose --path project --editor --quit

      - name: Build Web Export
        run: |
          EXPORT_DIR="${GITHUB_WORKSPACE:-$PWD}/export"
          mkdir -v -p "$EXPORT_DIR"
          godot --headless --verbose --path project --export-release "Web" "$EXPORT_DIR/index.html"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: export/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./export
